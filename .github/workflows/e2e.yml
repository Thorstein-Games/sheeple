name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sheeple-game
        uses: actions/checkout@v4
        with:
          path: sheeple-game

      # megingjord is a separate, private repo (Thorstein-Games/megingjord) that
      # the game server lives in. playwright.config.ts's webServer boots it via
      # `cd ../megingjord && pnpm dev`, so it must be checked out as a sibling
      # directory here too. The default GITHUB_TOKEN can't reach across
      # repos/orgs, so this needs a PAT with read access to that repo stored as
      # the MEGINGJORD_PAT secret on this repo.
      # Use the megingjord branch with the same name as this PR's branch when
      # there is one (server + client changes developed together), else main.
      - name: Pick megingjord ref
        id: megingjord-ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ secrets.MEGINGJORD_PAT }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Thorstein-Games/megingjord.git" "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout megingjord
        uses: actions/checkout@v4
        with:
          repository: Thorstein-Games/megingjord
          ref: ${{ steps.megingjord-ref.outputs.ref }}
          token: ${{ secrets.MEGINGJORD_PAT }}
          path: megingjord

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            sheeple-game/pnpm-lock.yaml
            megingjord/pnpm-lock.yaml

      - name: Install sheeple-game dependencies
        working-directory: sheeple-game
        run: pnpm install --frozen-lockfile

      - name: Install megingjord dependencies
        working-directory: megingjord
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: sheeple-game
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: sheeple-game
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sheeple-game/playwright-report/
          retention-days: 14
